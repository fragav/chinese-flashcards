<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>汉字 Flashcards</title>
<style>
  :root {
    --bg: #12121a;
    --card: #1e1e2a;
    --card-back: #26263a;
    --text: #f0f0f5;
    --muted: #8a8a9e;
    --accent: #e05a5a;
    --green: #3fae6a;
    --red: #d9534f;
    --border: #33334a;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  header {
    width: 100%;
    max-width: 480px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 20px;
  }
  header h1 { font-size: 1.1rem; font-weight: 600; }
  header h1 span { color: var(--accent); }
  .tabs button {
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 6px 14px;
    border-radius: 999px;
    cursor: pointer;
    font-size: 0.85rem;
    margin-left: 6px;
  }
  .tabs button.active { color: var(--text); border-color: var(--accent); }
  .levels {
    display: flex;
    gap: 8px;
    margin-bottom: 4px;
  }
  .levels button {
    flex: 1;
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 8px 0;
    border-radius: 10px;
    cursor: pointer;
    font-size: 0.85rem;
    font-weight: 600;
  }
  .levels button.active { color: #fff; background: var(--accent); border-color: var(--accent); }
  main {
    width: 100%;
    max-width: 480px;
    padding: 8px 20px 40px;
    flex: 1;
  }

  /* ---- card ---- */
  .scene { perspective: 1200px; margin-top: 12px; }
  .flashcard {
    position: relative;
    width: 100%;
    height: 340px;
    transform-style: preserve-3d;
    transition: transform 0.45s cubic-bezier(.4,.1,.2,1);
    cursor: pointer;
  }
  .flashcard.flipped { transform: rotateY(180deg); }
  .face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    border-radius: 20px;
    border: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 24px;
  }
  .face.front { background: var(--card); }
  .face.back { background: var(--card-back); transform: rotateY(180deg); }
  .hanzi { font-size: 6rem; line-height: 1; }
  .face.back .hanzi { font-size: 3rem; }
  .pinyin { font-size: 1.6rem; color: var(--accent); }
  .meaning { font-size: 1.3rem; text-align: center; }
  .hint { color: var(--muted); font-size: 0.8rem; position: absolute; bottom: 16px; }

  .answers {
    display: flex;
    gap: 12px;
    margin-top: 20px;
    visibility: hidden;
  }
  .answers.show { visibility: visible; }
  .answers button {
    flex: 1;
    padding: 14px;
    font-size: 1rem;
    font-weight: 600;
    border: none;
    border-radius: 14px;
    cursor: pointer;
    color: #fff;
  }
  .btn-wrong { background: var(--red); }
  .btn-right { background: var(--green); }

  .session-bar {
    display: flex;
    justify-content: space-between;
    color: var(--muted);
    font-size: 0.85rem;
    margin-top: 18px;
  }
  .session-bar b.ok { color: var(--green); }
  .session-bar b.no { color: var(--red); }

  /* ---- stats ---- */
  .stat-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 10px;
    margin: 12px 0 20px;
  }
  .stat {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 10px;
    text-align: center;
  }
  .stat .num { font-size: 1.5rem; font-weight: 700; }
  .stat .lbl { font-size: 0.72rem; color: var(--muted); margin-top: 4px; }
  .progress-wrap { margin-bottom: 22px; }
  .progress-wrap .lbl { font-size: 0.8rem; color: var(--muted); margin-bottom: 6px; display: flex; justify-content: space-between; }
  .progress-track {
    height: 10px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 999px;
    overflow: hidden;
  }
  .progress-fill { height: 100%; background: var(--green); border-radius: 999px; transition: width .3s; }
  h2 { font-size: 0.95rem; margin-bottom: 10px; color: var(--muted); font-weight: 600; }
  .miss-list { list-style: none; }
  .miss-list li {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px 14px;
    margin-bottom: 8px;
  }
  .miss-list .zi { font-size: 1.6rem; width: 48px; }
  .miss-list .info { flex: 1; }
  .miss-list .info .p { color: var(--accent); font-size: 0.85rem; }
  .miss-list .info .m { font-size: 0.85rem; color: var(--muted); }
  .miss-list .score { font-size: 0.8rem; text-align: right; }
  .miss-list .score .w { color: var(--red); font-weight: 700; }
  .empty { color: var(--muted); font-size: 0.9rem; text-align: center; padding: 30px 0; }
  .reset {
    margin-top: 24px;
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 8px 16px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 0.8rem;
    display: block;
    margin-left: auto;
    margin-right: auto;
  }
  .hidden { display: none; }
</style>
</head>
<body>
<header>
  <h1>汉字 <span>Flashcards</span></h1>
  <nav class="tabs">
    <button id="tab-study" class="active">Estudar</button>
    <button id="tab-stats">Progresso</button>
  </nav>
</header>

<main>
  <div class="levels">
    <button data-lvl="1">HSK 1</button>
    <button data-lvl="2">HSK 2</button>
    <button data-lvl="all">Todos</button>
  </div>
  <section id="view-study">
    <div class="scene">
      <div class="flashcard" id="card">
        <div class="face front">
          <div class="hanzi" id="f-hanzi"></div>
          <div class="hint">toque para virar</div>
        </div>
        <div class="face back">
          <div class="hanzi" id="b-hanzi"></div>
          <div class="pinyin" id="b-pinyin"></div>
          <div class="meaning" id="b-meaning"></div>
        </div>
      </div>
    </div>
    <div class="answers" id="answers">
      <button class="btn-wrong" id="btn-wrong">✗ Errei</button>
      <button class="btn-right" id="btn-right">✓ Acertei</button>
    </div>
    <div class="session-bar">
      <span>Sessão: <b class="ok" id="s-right">0</b> acertos · <b class="no" id="s-wrong">0</b> erros</span>
      <span id="s-count"></span>
    </div>
  </section>

  <section id="view-stats" class="hidden">
    <div class="stat-grid">
      <div class="stat"><div class="num" id="st-total">0</div><div class="lbl">respostas</div></div>
      <div class="stat"><div class="num" id="st-acc">–</div><div class="lbl">precisão</div></div>
      <div class="stat"><div class="num" id="st-seen">0</div><div class="lbl">cards vistos</div></div>
    </div>
    <div class="progress-wrap">
      <div class="lbl"><span>Dominados (3+ acertos, mais acertos que erros)</span><span id="st-mastered">0 / 0</span></div>
      <div class="progress-track"><div class="progress-fill" id="st-bar" style="width:0%"></div></div>
    </div>
    <h2>Os que você mais erra</h2>
    <ul class="miss-list" id="miss-list"></ul>
    <div class="empty hidden" id="miss-empty">Nenhum erro ainda. 加油!</div>
    <button class="reset" id="btn-reset">Zerar progresso</button>
  </section>
</main>

const DECKS = { "1": DECK1, "2": DECK2, "all": DECK1.concat(DECK2) };
const LVL_KEY = "zh-flash-lvl";
let level = localStorage.getItem(LVL_KEY) || "1";
if (!DECKS[level]) level = "1";
const deck = () => DECKS[level];

const KEY = "zh-flash-v1";
let stats = {};
try { stats = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { stats = {}; }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(stats)); } catch (e) {} };
const get = h => stats[h] || { c: 0, w: 0 };

let current = null, lastHanzi = null, sRight = 0, sWrong = 0;

// ponytail: sorteio ponderado simples — erros pesam mais, dominados quase saem; SRS real (Leitner/SM-2) se um dia precisar
function pickCard() {
  const D = deck();
  const weights = D.map(([h]) => {
    if (h === lastHanzi) return 0;
    const s = get(h);
    if (s.c === 0 && s.w === 0) return 3;        // nunca visto
    if (s.c >= 3 && s.w === 0) return 0.3;       // dominado
    return 1 + s.w * 2;                          // errado pesa mais
  });
  let total = weights.reduce((a, b) => a + b, 0);
  let r = Math.random() * total;
  for (let i = 0; i < D.length; i++) {
    r -= weights[i];
    if (r <= 0) return D[i];
  }
  return D[0];
}

const $ = id => document.getElementById(id);
const cardEl = $("card"), answersEl = $("answers");

function showCard() {
  current = pickCard();
  lastHanzi = current[0];
  cardEl.classList.remove("flipped");
  answersEl.classList.remove("show");
  // troca o conteúdo depois que a animação de desvirar termina
  setTimeout(() => {
    $("f-hanzi").textContent = current[0];
    $("b-hanzi").textContent = current[0];
    $("b-pinyin").textContent = current[1];
    $("b-meaning").textContent = current[2];
  }, current === null ? 0 : 230);
}

cardEl.addEventListener("click", () => {
  if (cardEl.classList.contains("flipped")) return;
  cardEl.classList.add("flipped");
  answersEl.classList.add("show");
});

function answer(right) {
  const s = get(current[0]);
  if (right) { s.c++; sRight++; } else { s.w++; sWrong++; }
  stats[current[0]] = s;
  save();
  $("s-right").textContent = sRight;
  $("s-wrong").textContent = sWrong;
  showCard();
}
$("btn-right").addEventListener("click", () => answer(true));
$("btn-wrong").addEventListener("click", () => answer(false));

// ---- stats view ----
function renderStats() {
  const D = deck();
  let total = 0, right = 0, seen = 0, mastered = 0;
  const missed = [];
  for (const [h, p, m] of D) {
    const s = get(h);
    const n = s.c + s.w;
    if (n > 0) seen++;
    total += n; right += s.c;
    if (s.c >= 3 && s.c > s.w) mastered++;
    if (s.w > 0) missed.push({ h, p, m, ...s });
  }
  $("st-total").textContent = total;
  $("st-acc").textContent = total ? Math.round(right / total * 100) + "%" : "–";
  $("st-seen").textContent = seen + " / " + D.length;
  $("st-mastered").textContent = mastered + " / " + D.length;
  $("st-bar").style.width = (mastered / D.length * 100) + "%";

  missed.sort((a, b) => b.w - a.w || a.c - b.c);
  const list = $("miss-list");
  list.innerHTML = "";
  missed.slice(0, 10).forEach(x => {
    const li = document.createElement("li");
    li.innerHTML = `<div class="zi">${x.h}</div>
      <div class="info"><div class="p">${x.p}</div><div class="m">${x.m}</div></div>
      <div class="score"><span class="w">${x.w} erro${x.w > 1 ? "s" : ""}</span><br>${x.c} acerto${x.c === 1 ? "" : "s"}</div>`;
    list.appendChild(li);
  });
  $("miss-empty").classList.toggle("hidden", missed.length > 0);
}

$("btn-reset").addEventListener("click", () => {
  if (confirm("Apagar todo o progresso?")) { stats = {}; save(); renderStats(); }
});

// ---- tabs ----
function switchTab(study) {
  $("view-study").classList.toggle("hidden", !study);
  $("view-stats").classList.toggle("hidden", study);
  $("tab-study").classList.toggle("active", study);
  $("tab-stats").classList.toggle("active", !study);
  if (!study) renderStats();
}
$("tab-study").addEventListener("click", () => switchTab(true));
$("tab-stats").addEventListener("click", () => switchTab(false));

// ---- level selector ----
const lvlButtons = document.querySelectorAll(".levels button");
function renderLevel() {
  lvlButtons.forEach(b => b.classList.toggle("active", b.dataset.lvl === level));
}
lvlButtons.forEach(b => b.addEventListener("click", () => {
  if (b.dataset.lvl === level) return;
  level = b.dataset.lvl;
  try { localStorage.setItem(LVL_KEY, level); } catch (e) {}
  renderLevel();
  lastHanzi = null;
  showCard();
  if ($("view-stats").classList.contains("hidden") === false) renderStats();
}));
renderLevel();

showCard();
</script>
